name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # Unity 6 的 Personal 许可证不再生成 .ulf，CI 走 UNITY_EMAIL + UNITY_PASSWORD
      # 账号激活；如果手上有旧版 .ulf，也可以额外配置 UNITY_LICENSE。
      - name: Check Unity license secrets
        shell: bash
        run: |
          if [ -n "${UNITY_LICENSE:-}" ] || [ -n "${UNITY_SERIAL:-}" ]; then
            echo "使用许可证文件/序列号激活。"
            exit 0
          fi
          if [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; then
            echo "::error::缺少 Unity 许可证凭据。请在仓库 Settings > Secrets and variables > Actions 配置 UNITY_EMAIL 与 UNITY_PASSWORD（Unity 账号需关闭两步验证）。详见 Docs/CI.md。"
            exit 1
          fi
          echo "使用 UNITY_EMAIL + UNITY_PASSWORD 激活。"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: 群星海战/Library
          key: Library-iOS-${{ hashFiles('群星海战/Assets/**', '群星海战/Packages/**', '群星海战/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      # 第一步：Unity 导出 Xcode 工程到 build/iOS
      # v6 是新版 CLI 的薄封装，支持 Unity 6 的 Personal 账号激活
      # （UNITY_EMAIL + UNITY_PASSWORD，不再依赖 .ulf）。
      - name: Build Unity iOS Xcode project
        uses: game-ci/unity-builder@v6
        with:
          projectPath: 群星海战
          targetPlatform: iOS
          buildsPath: build
          unityVersion: auto
          cliVersion: v0.1.72
          allowDirtyBuild: true
          cacheUnityInstallationOnMac: true

      # 第二步：用 xcodebuild 编出未签名 .app，再打包成未签名 IPA。
      # 未签名 IPA 交给 AltStore / Sideloadly 用免费 Apple ID 自签。
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "build/iOS/Unity-iPhone.xcodeproj" ]; then
            XCODE_DIR="build/iOS"
          elif [ -d "群星海战/build/iOS/Unity-iPhone.xcodeproj" ]; then
            XCODE_DIR="群星海战/build/iOS"
          else
            echo "::error::找不到 Unity-iPhone.xcodeproj，请检查 game-ci 的 buildsPath 输出。"
            exit 1
          fi

          DERIVED="$RUNNER_TEMP/DerivedData"

          xcodebuild \
            -project "$XCODE_DIR/Unity-iPhone.xcodeproj" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          APP_PATH="$(ls -d "$DERIVED/Build/Products/Release-iphoneos/"*.app | head -n 1)"
          test -n "$APP_PATH"

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent Payload StellarSea-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: StellarSea-unsigned-ipa
          path: ${{ runner.temp }}/StellarSea-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
